name: check
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi python3-pyelftools python3-unicorn
      - name: agbcc
        run: ./tools/install_agbcc.sh
      - name: tree check
        run: python3 tools/scripts/check_tree.py
      - name: tooling regression tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: validate progress, names, source call graph and raw data inventory (no ROM)
        run: python3 tools/scripts/progress.py --out build/progress
      - name: compile every C module (matching + NONMATCHING drafts); no ROM needed
        run: |
          for f in src/*.c; do m=$(basename $f .c); make -s build/src/$m.o; make -s BUILD=build_nm NM_FLAGS=-DNONMATCHING build_nm/src/$m.o; done
      - name: SDK compiler flag and ABI fixtures (no ROM needed)
        run: |
          /usr/bin/python3 tools/scripts/test_sdk_tst.py
          /usr/bin/python3 tools/scripts/test_sdk_tst_matches.py
          /usr/bin/python3 tools/scripts/test_sdk_lsr_flags.py --compiler tools/agbcc_sdk_flags/bin/agbcc --reference-compiler tools/agbcc_tst/bin/agbcc
          /usr/bin/python3 tools/scripts/test_sdk_halfword_alignment.py --compiler tools/agbcc_sdk_flags/bin/agbcc --reference-compiler tools/agbcc_tst/bin/agbcc
          /usr/bin/python3 tools/scripts/test_sdk_trampoline_alignment.py --compiler tools/agbcc_sdk_flags/bin/agbcc --reference-compiler tools/agbcc_tst/bin/agbcc
          /usr/bin/python3 tools/scripts/test_sdk_reader_match.py
          /usr/bin/python3 tools/scripts/test_sdk_postdec_flags.py
          /usr/bin/python3 tools/scripts/test_sdk_postdec_rtl.py
          /usr/bin/python3 tools/scripts/test_sdk_pattern_container.py
          /usr/bin/python3 tools/scripts/test_sdk_umul.py
          /usr/bin/python3 tools/scripts/test_sdk_sound_match.py
          /usr/bin/python3 tools/scripts/test_sdk_shared_pool.py
          /usr/bin/python3 tools/scripts/test_sdk_btm_match.py
          /usr/bin/python3 tools/scripts/test_sdk_btm_flags.py
          /usr/bin/python3 tools/scripts/test_sdk_btm_registers.py
          /usr/bin/python3 tools/scripts/test_sdk_btm_rtl.py
          /usr/bin/python3 tools/scripts/test_sdk_vsync_match.py
          /usr/bin/python3 tools/scripts/test_sdk_vsync_flags.py
          /usr/bin/python3 tools/scripts/test_sdk_sound_runtime.py
          /usr/bin/python3 tools/scripts/test_sdk_sub_flags.py
          /usr/bin/python3 tools/scripts/test_sdk_text_literal_ownership.py
          /usr/bin/python3 tools/scripts/test_sdk_text_literal_geometry.py
          /usr/bin/python3 tools/scripts/test_sdk_text_literal_runtime.py
          /usr/bin/python3 tools/scripts/test_sdk_text_literal_geometry.py --combined
          /usr/bin/python3 tools/scripts/test_sdk_text_literal_runtime.py --combined
  progress:
    # Agents never commit docs/progress/*: it is regenerated here after every push to the main branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/rom-decompilation-research-obsal6'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: regenerate and publish progress from latest main
        run: |
          git config user.name "progress-bot"; git config user.email "progress-bot@users.noreply.github.com"
          python3 tools/scripts/publish_progress.py
