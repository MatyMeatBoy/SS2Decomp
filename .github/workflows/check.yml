name: check
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi python3-pyelftools
      - name: agbcc
        run: ./tools/install_agbcc.sh
      - name: tree check
        run: python3 tools/scripts/check_tree.py
      - name: tooling regression tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: validate progress, names, source call graph and raw data inventory (no ROM)
        run: python3 tools/scripts/progress.py --out build/progress
      - name: compile every C module (matching + NONMATCHING drafts); no ROM needed
        run: |
          for f in src/*.c; do m=$(basename $f .c); make -s build/src/$m.o; make -s BUILD=build_nm NM_FLAGS=-DNONMATCHING build_nm/src/$m.o; done
  progress:
    # Agents never commit docs/progress/*: it is regenerated here after every push to the main branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/rom-decompilation-research-obsal6'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: regenerate progress, names, source call graph and raw data inventory
        run: python3 tools/scripts/progress.py
      - name: commit if changed
        run: |
          git config user.name "progress-bot"; git config user.email "progress-bot@users.noreply.github.com"
          git add docs/progress
          git diff --cached --quiet || { git commit -m "progress: update [skip ci]" && git push || true; }
